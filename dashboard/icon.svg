<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#07090d"/>

  <!-- Green ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00d68f" stroke-width="10"/>

  <!-- Chart line -->
  <polyline
    points="77,358 150,295 205,320 275,210 335,175 435,100"
    fill="none"
    stroke="#00d68f"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Dot at end of chart -->
  <circle cx="435" cy="100" r="18" fill="#00d68f"/>

  <!-- Small dot trail -->
  <circle cx="275" cy="210" r="8" fill="#00d68f" opacity="0.6"/>
  <circle cx="335" cy="175" r="8" fill="#00d68f" opacity="0.6"/>

  <!-- Bottom label "TA" -->
  <text x="256" y="430"
    font-family="monospace"
    font-size="72"
    font-weight="bold"
    fill="#00d68f"
    opacity="0.4"
    text-anchor="middle">TA</text>
</svg>
